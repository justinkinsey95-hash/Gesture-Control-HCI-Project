<g font-family="Arial" font-size="17" text-anchor="middle">
<circle cx="155" cy="180" r="28" fill="#374151"/><text x="155" y="187" fill="#d1d5db" font-size="23">➤</text><text x="155" y="227" fill="#9ca3af">Select browser</text>
